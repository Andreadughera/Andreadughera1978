services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cryptosentinel
      POSTGRES_USER: cryptosentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptosentinel -d cryptosentinel"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      STATIC_DIR: /app/public
      DATABASE_URL: postgres://cryptosentinel:${POSTGRES_PASSWORD}@db:5432/cryptosentinel
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?set DASHBOARD_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?set SETTINGS_ENCRYPTION_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-false}
      MAX_TRADE_NOTIONAL_USD: ${MAX_TRADE_NOTIONAL_USD:-10}
      MAX_NEW_TRADES_PER_SESSION: ${MAX_NEW_TRADES_PER_SESSION:-1}
      STOP_AFTER_FIRST_FILL: ${STOP_AFTER_FIRST_FILL:-true}
      MAX_OPEN_POSITIONS: ${MAX_OPEN_POSITIONS:-2}
      MAX_TOTAL_EXPOSURE_USD: ${MAX_TOTAL_EXPOSURE_USD:-20}
      ENABLE_SIGNAL_AUTO_SELL: ${ENABLE_SIGNAL_AUTO_SELL:-false}
      ENABLE_LISTING_AUTO_TRADE: ${ENABLE_LISTING_AUTO_TRADE:-false}
      ALLOW_MOCK_MARKET_DATA: ${ALLOW_MOCK_MARKET_DATA:-false}
      CDC_API_KEY: ${CDC_API_KEY:-}
      CDC_SECRET_KEY: ${CDC_SECRET_KEY:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
